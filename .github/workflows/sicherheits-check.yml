# Aenderungsdatum: 2026-11-07
# Fuehrt dieselbe Schnellpruefung wie der lokale Pre-Commit-Hook auf GitHub aus -
# auch fuer Commits, die lokal ohne Hook oder mit --no-verify entstanden sind.
# Abhaengigkeit: scripts/security-quick-check.sh
name: Sicherheits-Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pruefbereich bestimmen
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            # Neuer Branch: vor dem Push gab es keinen Stand - gegen den Standard-Branch pruefen.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Schnellpruefung
        run: bash scripts/security-quick-check.sh --range "${{ steps.range.outputs.base }}" HEAD
